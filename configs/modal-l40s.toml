[run]
iterations = 4000
checkpoint_every = 12
dashboard_every = 5
device = "cuda"

[model]
d_model = 384
n_layers = 6
n_heads = 12
n_kv_heads = 2
d_ff = 1152
trick_win_token = true
turn_token = "bid"

[training]
seed = 0
hand_sizes = [3, 4, 5, 6, 7, 8, 9, 10]
player_counts = [3, 4, 5]
player_count_weights = [2.0, 3.0, 4.0]
schedule_repeats = 1
deals_per_shape = 8
games_per_cell = 0
reference_rate = 0.5
branch_rate_player_exponent = 0.0
exhaustive_until = 7
bid_mode = "stratified"
bid_top_k = 5
play_mode = "stratified"
play_top_k = 4
learning_rate = 0.0004
core_learning_rate = 5e-05
auxiliary_learning_rate = 5e-05
lr_warmup_updates = 100
epochs = 1
# The L40S update phase runs after KV caches are released, so it can use a
# larger activation microbatch independently of the rollout cache ceiling.
microbatch_positions = 131072
use_kv_cache = true
policy_objective = "neurd"
policy_coef = 1.0
policy_kl_cap = 0.01
policy_kl_p99_cap = 0.20
neurd_regret_coef = 1.0
neurd_kl_coef = 1.0
neurd_advantage_clip = 0.0
neurd_inclusion_exponent = 1.0
neurd_inclusion_cap = 0.0
sampled_mirror_step_size = 1.0
sampled_mirror_target_kl = 0.003
sampled_mirror_uniform_mix = 0.02
sampled_mirror_advantage_clip = 10.0
sampled_mirror_inclusion_exponent = 1.0
sampled_mirror_inclusion_cap = 12.0
kl_backtrack_attempts = 8
kl_backtrack_factor = 0.5
branch_depth_exponent = -0.5
value_objective = "mse"
value_positions = "policy"
value_reward_scale = 5.0
value_coef = 0.5
suit_coef = 0.05
bid_hit_coef = 0.0
trick_coef = 0.05
entropy_coef = 0.0
league_max_snapshots = 8
league_min_iteration = 0

[rollout]
# 262,144 fp16 KV rows consume 32.61 GB for this model. That leaves roughly
# 15 GB of the L40S for weights, logits, attention temporaries, and allocator
# headroom. Historical mode divides the row ceiling across its two models.
max_cache_rows = 262144
cache_budget_gb = 40.0
auto_deals_per_batch = false
deals_per_batch = 4
# Every shape has four self and four anchor deals. The L40S advances two of
# each in one wave loop even for ten-card hands; the local MPS preset retains
# its five-card cutoff.
parallel_deals_max_hand_size = 10
opponent_mode = "heuristic_then_historical"
opponent_fraction = 0.5
opponent_packing = "concurrent"
kv_dtype = "fp16"
bid_position_mode = "uniform"

[evaluation]
every = 25
deals = 6
seed = 1234
action_seed = 17
batch_size = 256
training_action_mode = "sample"
opponent_switch_reward = 0.0
opponent_switch_consecutive = 4
