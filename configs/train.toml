[run]
iterations = 4000
checkpoint_every = 100
dashboard_every = 5
device = "auto"

[model]
d_model = 384
n_layers = 6
n_heads = 12
n_kv_heads = 2
d_ff = 1152
trick_win_token = true
turn_token = "bid"

[training]
seed = 0
hand_sizes = [3, 4, 5, 6, 7, 8, 9, 10]
player_counts = [3, 4, 5]
player_count_weights = [2.0, 3.0, 4.0]
schedule_repeats = 1
# 24 cells (3 player counts x 8 hand sizes), two deals each = 48 deals/update.
# The two seats are drawn uniformly iid, not cycled.
deals_per_shape = 2
games_per_cell = 0
reference_rate = 0.5
branch_rate_player_exponent = 0.0
exhaustive_until = 7
# Bidding is the root of every counterfactual tree: take four distinct
# policy-drawn bids plus one guaranteed distinct uniform explorer.
bid_mode = "gumbel_top_k_plus_random"
bid_top_k = 4
play_mode = "gumbel_top_k_plus_random"
play_top_k = 3
learning_rate = 0.0002
lr_warmup_updates = 100
epochs = 1
microbatch_positions = 16384
policy_objective = "mirror_descent"
policy_coef = 1.0
policy_kl_cap = 0.005
neurd_regret_coef = 1.0
neurd_kl_coef = 1.0
neurd_advantage_clip = 10.0
neurd_inclusion_exponent = 1.0
neurd_inclusion_cap = 12.0
mirror_step_size = 1.0
mirror_target_kl = 0.003
mirror_uniform_mix = 0.02
mirror_advantage_clip = 10.0
mirror_inclusion_exponent = 1.0
mirror_inclusion_cap = 12.0
kl_backtrack_attempts = 8
kl_backtrack_factor = 0.5
# Counterfactual nodes multiply with depth. Pull policy weight toward the root
# so bidding and early plays are not drowned out by thousands of deep leaves.
branch_depth_exponent = -1.0
value_coef = 0.5
suit_coef = 0.15
bid_hit_coef = 0.0
trick_coef = 0.15
entropy_coef = 0.0
league_max_snapshots = 8
league_min_iteration = 0

[rollout]
max_cache_rows = 65536
cache_budget_gb = 10.0
# One deal per wave loop, always. Batching same-shape deals together
# would make them share the row cap, so a 10-card tree would branch to
# half the width it can reach alone -- exactly the shape that needs the
# room most. One rollout per hand keeps the whole cap per tree.
auto_deals_per_batch = false
deals_per_batch = 1
historical_arm = "paired"
kv_dtype = "fp16"
bid_position_mode = "uniform"

[evaluation]
every = 100
deals = 6
seed = 1234
batch_size = 256
