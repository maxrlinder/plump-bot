[run]
iterations = 4000
checkpoint_every = 50
dashboard_every = 5
device = "auto"

[model]
d_model = 384
n_layers = 6
n_heads = 12
n_kv_heads = 2
d_ff = 1152
trick_win_token = true
turn_token = "bid"

[training]
seed = 0
hand_sizes = [3, 4, 5, 6, 7, 8, 9, 10]
player_counts = [3, 4, 5]
player_count_weights = [2.0, 3.0, 4.0]
schedule_repeats = 1
# 24 cells (3 player counts x 8 hand sizes), two deals each = 48 deals/update.
# The two seats are drawn uniformly iid, not cycled.
deals_per_shape = 2
games_per_cell = 0
reference_rate = 0.5
branch_rate_player_exponent = 0.0
exhaustive_until = 7
# Bidding uses five distinct policy-mass strata and play uses four. When fewer
# actions are legal they are all evaluated. Otherwise one conditional-policy
# representative per stratum gives exact inclusion, backup, and reach weights.
bid_mode = "stratified"
bid_top_k = 5
play_mode = "stratified"
play_top_k = 4
learning_rate = 0.0002
core_learning_rate = 0.000025
auxiliary_learning_rate = 0.000025
lr_warmup_updates = 100
epochs = 1
microbatch_positions = 16384
precision = "fp32"
policy_objective = "neurd"
policy_coef = 1.0
policy_kl_cap = 0.01
policy_kl_p99_cap = 0.05
ppo_clip_ratio = 0.10
ppo_trainable_policies = 1
ppo_self_play_seats = "all"
ppo_critic_mode = "privileged"
ppo_critic_learning_rate = 0.0003
ppo_critic_epochs = 4
ppo_advantage_normalize = true
ppo_entropy_mode = "adaptive"
ppo_entropy_coef = 0.01
ppo_entropy_learning_rate = 0.001
ppo_bid_entropy_target = 0.65
ppo_play_entropy_target = 0.60
neurd_regret_coef = 1.0
# Inert at epochs = 1. Gradients accumulate over every microbatch before the
# single optimizer step, so the model still equals pi_old when this term is
# differentiated and KL(pi_old || pi_theta) contributes exactly zero gradient.
# Tuning it changes nothing until epochs > 1; the live guard is policy_kl_cap.
neurd_kl_coef = 1.0
neurd_advantage_clip = 0.0
neurd_inclusion_exponent = 1.0
neurd_inclusion_cap = 0.0
sampled_mirror_step_size = 1.0
sampled_mirror_target_kl = 0.003
sampled_mirror_uniform_mix = 0.02
sampled_mirror_advantage_clip = 10.0
sampled_mirror_inclusion_exponent = 1.0
sampled_mirror_inclusion_cap = 12.0
kl_backtrack_attempts = 8
kl_backtrack_factor = 0.5
# Counterfactual nodes multiply with depth. Pull policy weight toward the root
# so bidding and early plays are not drowned out by thousands of deep leaves.
branch_depth_exponent = -0.5
value_objective = "mse"
value_positions = "policy"
value_reward_scale = 5.0
value_coef = 0.5
suit_coef = 0.05
bid_hit_coef = 0.0
trick_coef = 0.05
entropy_coef = 0.0
league_max_snapshots = 8
league_min_iteration = 0

[rollout]
max_cache_rows = 65536
cache_budget_gb = 10.0
# The two independently dealt seats/hands for a shape share one wave through
# five cards. Six cards and above run one at a time so each wide tree gets the
# full cache budget.
auto_deals_per_batch = false
deals_per_batch = 2
parallel_deals_max_hand_size = 5
# Keep the update at 48 deals: 24 current-policy self-play and 24 anchor games.
# The anchor begins as the deterministic heuristic. After the sampled policy's
# mean evaluation reward is positive four evaluations in a row, it switches
# permanently to eligible recent checkpoints from the historical league.
opponent_mode = "heuristic_then_historical"
opponent_fraction = 0.5
opponent_packing = "concurrent"
kv_dtype = "fp16"
bid_position_mode = "uniform"

[evaluation]
every = 100
deals = 6
seed = 1234
action_seed = 17
batch_size = 256
training_action_mode = "sample"
opponent_switch_reward = 0.0
opponent_switch_consecutive = 4
